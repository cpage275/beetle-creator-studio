<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beetle Environment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    html, body, #env-app, #env-canvas-container { height: 100%; width: 100%; margin: 0; }
    #env-canvas-container { position: relative; background: #000000; }
    #env-canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body class="env-body">
  <div id="env-app">
    <div id="env-canvas-container">
      <canvas id="env-canvas"></canvas>
      <!-- "Create a new beetle" button -->
      <div id="env-create-btn-wrapper">
        <button id="env-create-btn">Create a new beetle</button>
      </div>
    </div>
  </div>

  <!-- Loader overlay (visible until environment is ready) -->
  <div id="loader-overlay" class="loader-overlay">
    <video autoplay loop muted playsinline>
      <source src="./icons/loader.webm" type="video/webm" />
    </video>
    <p id="loader-text" class="loader-label">Entering simulated beetle environment...</p>
  </div>

  <!-- Optional runtime env for static hosting (GH Pages). Safe to 404 locally. -->
  <script src="./env.js" crossorigin="anonymous"></script>
  <script type="module" src="./src/environment.js"></script>
</body>
</html>
